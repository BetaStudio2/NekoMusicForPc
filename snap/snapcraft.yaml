name: nekomusic
base: core24
version: '1.0.1'
summary: Neko歌姬计划 高品质无损云音乐播放器（Flutter 版）
description: |
  Neko歌姬计划：基于 Flutter 的无损云音乐播放器。
  （Qt 核心桥 + libmpv 播放引擎；本 snap 装配预构建二进制与系统级 Qt/mpv 运行库）

grade: stable
confinement: strict

apps:
  nekomusic:
    command: nekomusic
    plugs:
      - network
      - network-status
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - unity7

parts:
  # 预构建 bundle（exe + data + lib 相对路径不变）
  nekomusic:
    plugin: dump
    source: bundle
    organize:
      neko_music: bin/nekomusic
    stage:
      - bin/nekomusic
      - data
      - lib

  # Qt6/GTK/mpv 运行库（core24 自带 gtk 经 gnome 扩展；Qt6 与 mpv 显式带入）
  qt6-runtime:
    plugin: nil
    stage-packages:
      - libqt6core6
      - libqt6network6
      - libqt6sql6
      - libqt6gui6
      - libayatana-appindicator3-1
      - libmpv2
      - qt6-qpa-plugins
      - libqt6svg6
      - libgtk-3-0t64
      - libglib2.0-0
      - libasound2
      - fonts-noto-cjk
