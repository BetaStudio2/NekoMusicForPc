name: build-Releases

# 三平台一键出包：Linux(.deb) / Windows(NSIS .exe) / macOS(通用架构 .pkg)
# push 即触发；打 tag（v*）时额外上传到 GitHub Release 作为发布资产。

'on':
  push:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因（可选）"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.2'
  ZIG_VERSION: '0.16.0'

jobs:
  # ============================================================
  # Linux：本机构建 + CPack 打包 .deb
  # ============================================================
  linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Qt 6 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Setup Zig (EraAudio kernel)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install packaging deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            fakeroot \
            nasm \
            libssl-dev \
            pkg-config

      - name: Build minimal FFmpeg (audio-only, LGPL, TLS)
        run: |
          set -euo pipefail
          bash third_party/neko-audio-engine/tools/build-ffmpeg-minimal.sh

      - name: Build and package (.deb)
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
          NEKO_FFMPEG_ROOT: ${{ github.workspace }}/third_party/ffmpeg-minimal/linux-x86_64
          NEKO_FFMPEG_BUNDLE: 'ON'
        run: |
          set -euo pipefail
          echo "Qt: ${QT_ROOT_DIR:-<未设置>}"
          echo "FFmpeg: ${NEKO_FFMPEG_ROOT}"
          chmod +x build_linux.sh
          ./build_linux.sh Release

      # 断言原生无缝播放引擎确实被构建并链接（否则说明 FFmpeg 开发库缺失，
      # 悄悄回退到 QMediaPlayer —— 这里显式失败，避免 CI 假绿）。
      - name: Verify native engine is linked
        run: |
          set -euo pipefail
          BIN="build-linux/NekoMusic"
          test -x "$BIN" || { echo "未找到 $BIN"; exit 1; }
          echo "== ldd FFmpeg 依赖 =="
          ldd "$BIN" | grep -E "libavformat|libavcodec|libavutil|libswresample" \
            || { echo "原生引擎未链接（libav* 缺失）— FFmpeg 开发库可能未装"; exit 1; }
          echo "== RUNPATH =="
          readelf -d "$BIN" | grep -E 'RPATH|RUNPATH' || true
          echo "== EraAudio 内核符号 =="
          nm "$BIN" | grep -q ' T zk_decoder_open' \
            || { echo "EraAudio 内核未链接（zk_* 缺失）— zig 未生效？"; exit 1; }

      - name: Resolve artifact path
        id: pack
        run: |
          set -euo pipefail
          DEB="$(find dist -maxdepth 1 -name 'Neko歌姬计划-*-linux-amd64.deb' -type f | head -n1 || true)"
          if [[ -z "$DEB" ]]; then
            echo "未在 dist/ 找到 .deb"
            ls -la dist || true
            exit 1
          fi
          ls -lh "$DEB"
          echo "file=$DEB" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}

  # ============================================================
  # Windows 用最小 FFmpeg：在 Linux 上交叉编译（MinGW-w64）
  # 避免 Windows/Git-Bash 下 FFmpeg configure 生成 MSYS 路径、原生 make 无法解析。
  # ============================================================
  ffmpeg-win:
    name: FFmpeg (Windows cross)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MinGW cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm

      - name: Build minimal FFmpeg (windows x86_64)
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          AR: x86_64-w64-mingw32-ar
          RANLIB: x86_64-w64-mingw32-ranlib
          NM: x86_64-w64-mingw32-nm
          STRIP: x86_64-w64-mingw32-strip
          FFMPEG_TARGET_OS: windows
          FFMPEG_TARGET_ARCH: x86_64
          FFMPEG_CONFIGURE_EXTRA: --enable-cross-compile --cross-prefix=x86_64-w64-mingw32-
        run: |
          set -euo pipefail
          bash third_party/neko-audio-engine/tools/build-ffmpeg-minimal.sh

      - name: Upload FFmpeg artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win
          path: third_party/ffmpeg-minimal/windows-x86_64
          if-no-files-found: error

  # ============================================================
  # Windows：原生构建（Qt 官方 MinGW 套件）→ windeployqt → NSIS 安装包
  # ============================================================
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 120
    needs: ffmpeg-win

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download minimal FFmpeg (Windows)
        uses: actions/download-artifact@v7
        with:
          name: ffmpeg-win
          path: third_party/ffmpeg-minimal/windows-x86_64

      - name: Setup Qt 6 (Windows MinGW kit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true
          install-deps: false

      - name: Setup Zig (EraAudio kernel)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build, deploy and package (.exe)
        shell: pwsh
        # 原生无缝播放引擎：CI 用 Qt 自带 MinGW 在 Git Bash 内自建「最小 · 仅音频 ·
        # 纯 LGPL · schannel TLS」FFmpeg（见下方脚本调用），链接并随包分发其 DLL。
        run: |
          $ErrorActionPreference = 'Stop'
          $root     = $PWD.Path
          $buildDir = Join-Path $root 'build-windows'
          $stage    = Join-Path $root 'build'          # NSIS 脚本约定的待打包目录

          # Qt 自带的 MinGW 工具链（g++ / gcc），确保优先于其它编译器
          $mingw = Get-ChildItem $env:IQTA_TOOLS -Directory |
                   Where-Object { Test-Path (Join-Path $_.FullName 'bin\g++.exe') } |
                   Select-Object -First 1
          if (-not $mingw) { throw "未在 $env:IQTA_TOOLS 找到 MinGW 工具链" }
          $env:Path = "$($mingw.FullName)\bin;$env:Path"

          if (-not $env:QT_ROOT_DIR) { throw "未取到 QT_ROOT_DIR，install-qt-action 可能没装上 Qt" }
          Write-Host "Qt    : $env:QT_ROOT_DIR"
          Write-Host "MinGW : $($mingw.FullName)"
          & g++ --version | Select-Object -First 1

          # ---- 最小 FFmpeg（仅音频 · 纯 LGPL · schannel TLS）----
          # 由 `ffmpeg-win` job 在 Linux 上以 MinGW-w64 交叉编译后经 artifact 下载到
          # third_party/ffmpeg-minimal/windows-x86_64（避免 Windows/Git-Bash 下
          # FFmpeg configure 的 MSYS 路径问题）。CMake NEKO_FFMPEG_BUNDLE=ON 部署 DLL。
          $ffRoot = Join-Path $root 'third_party\ffmpeg-minimal\windows-x86_64'
          if (-not (Test-Path (Join-Path $ffRoot 'include\libavformat\avformat.h'))) {
            throw "未在 $ffRoot 找到最小 FFmpeg（ffmpeg-win artifact 未下载？）"
          }
          $env:NEKO_FFMPEG_ROOT = $ffRoot
          Write-Host "FFmpeg(engine): $ffRoot"
          Get-ChildItem (Join-Path $ffRoot 'bin') -Filter '*.dll' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }

          $ffArg = @("-DNEKO_FFMPEG_ROOT=$ffRoot", "-DNEKO_FFMPEG_BUNDLE=ON")

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

          # ---------------- 构建 ----------------
          cmake -S $root -B $buildDir -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            @ffArg
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

          cmake --build $buildDir --parallel
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

          $exe = Join-Path $buildDir 'NekoMusic.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }

          # ---------------- 部署 Qt 依赖 ----------------
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # 先部署依赖，再把主程序拷进去（避免 windeployqt 面对目标目录内的自身产物）
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --compiler-runtime `
            --dir $stage $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败，退出码 $LASTEXITCODE" }

          Copy-Item $exe (Join-Path $stage 'NekoMusic.exe')

          # 兼容 windeployqt 把插件放进 plugins\ 子目录的布局
          $pluginsSub = Join-Path $stage 'plugins'
          if (Test-Path $pluginsSub) {
            Copy-Item (Join-Path $pluginsSub '*') $stage -Recurse -Force
            Remove-Item $pluginsSub -Recurse -Force
          }

          # windeployqt 只跟随 exe 的导入表；链接了但未被引用的模块（如 SvgWidgets/Concurrent）
          # 它不会拷，但 NSIS 里是必选文件，这里从 Qt 的 bin 兜底补齐
          $qtDlls = @(
            'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Multimedia.dll',
            'Qt6Network.dll', 'Qt6Sql.dll', 'Qt6Svg.dll', 'Qt6SvgWidgets.dll',
            'Qt6Concurrent.dll'
          )
          foreach ($dll in $qtDlls) {
            $dst = Join-Path $stage $dll
            if (-not (Test-Path $dst)) {
              $srcDll = Join-Path $env:QT_ROOT_DIR "bin\$dll"
              if (Test-Path $srcDll) {
                Copy-Item $srcDll $dst
                Write-Host "  补拷 ${dll}（windeployqt 未部署）"
              }
            }
          }

          # MinGW 运行库兜底（同上）
          $mingwDlls = @('libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll')
          foreach ($dll in $mingwDlls) {
            $dst = Join-Path $stage $dll
            if (-not (Test-Path $dst)) {
              $srcDll = Join-Path $mingw.FullName "bin\$dll"
              if (Test-Path $srcDll) {
                Copy-Item $srcDll $dst
                Write-Host "  补拷 ${dll}（来自 MinGW 工具链）"
              }
            }
          }

          # 原生引擎链接的最小 FFmpeg：拷自建 shared 构建的 bin/*.dll（不再复用 Qt 自带的
          # 完整 FFmpeg），并断言 exe 导入表确实引用了 av*.dll。
          if ($env:NEKO_FFMPEG_ROOT) {
            $ffBin = Join-Path $env:NEKO_FFMPEG_ROOT 'bin'
            Get-ChildItem (Join-Path $ffBin '*.dll') |
              ForEach-Object {
                Copy-Item $_.FullName (Join-Path $stage $_.Name) -Force
                Write-Host "  拷贝 $($_.Name)（自建最小 FFmpeg）"
              }
            $objdump = Join-Path $mingw.FullName 'bin\objdump.exe'
            if (Test-Path $objdump) {
              $avImp = & $objdump -p $exe 2>$null | Select-String 'DLL Name: av'
              if (-not $avImp) { throw "原生引擎未链接 FFmpeg（NEKO_FFMPEG_ROOT 未生效？）" }
              Write-Host "  原生引擎已链接: $((($avImp | ForEach-Object { $_.ToString().Trim() }) -join '; '))"
            }
          }

          # NSIS 脚本里这些是必选文件，缺失时在这里就报清楚，别等 makensis 中止
          $required = @('NekoMusic.exe', 'platforms\qwindows.dll') + $qtDlls + $mingwDlls
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $stage $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "---- $stage 内容 ----"
            Get-ChildItem $stage -Recurse -Depth 1 | Select-Object -First 60 FullName
            throw "部署目录缺少必需文件: $($missing -join ', ')"
          }

          # ---------------- NSIS 打包 ----------------
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          }
          if (-not $makensis -or -not (Test-Path $makensis)) { throw "未找到 makensis.exe" }

          $version = [regex]::Match((Get-Content (Join-Path $root 'CMakeLists.txt') -Raw),
            '(?m)^\s*VERSION\s+([0-9][0-9.]*)\s*$').Groups[1].Value
          if (-not $version) { throw "无法从 CMakeLists.txt 解析版本号" }
          Write-Host "版本: $version"

          Write-Host "部署目录: $stage"
          Get-ChildItem $stage -Filter '*.exe' | Select-Object Name, Length | Format-Table

          # 脚本内为 UTF-8（无 BOM），需显式指定输入字符集；
          # BUILD_DIR 传绝对路径，避免 makensis 对相对路径的解析基准不一致
          Push-Location (Join-Path $root 'packaging')
          try {
            & $makensis -V2 -INPUTCHARSET UTF8 "-DBUILD_DIR=$stage" `
              "-DVERSION=$version" nekomusic_installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis 失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          # NSIS 的 OutFile 约定落在仓库根目录；兜底再全仓搜一次
          $installer = Join-Path $root "Neko歌姬计划-$version-win.exe"
          if (-not (Test-Path $installer)) {
            $found = Get-ChildItem -Path $root -Recurse -Filter '*-win.exe' -File `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $installer = $found.FullName }
          }
          if (-not $installer -or -not (Test-Path $installer)) { throw "未生成 Windows 安装包" }

          $dist = Join-Path $root 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $target = Join-Path $dist "Neko歌姬计划-$version-win.exe"
          Copy-Item $installer $target -Force
          Get-Item $target | Format-List Name, Length

      - name: Resolve artifact path
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path dist -Filter '*-win.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "未在 dist/ 找到安装包" }
          "file=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}

  # ============================================================
  # macOS：通用架构（arm64 + x86_64）.pkg
  # ============================================================
  macos:
    name: macOS (.pkg, universal)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Qt 6 (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Setup Zig (EraAudio kernel)
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build and package (universal .pkg)
        env:
          QT_MAC_ROOT: ${{ env.QT_ROOT_DIR }}
          # Qt 6.10 的 dylib 最低要求 macOS 13，按 11 链接只会刷一堆 ld 版本告警
          OSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          set -euo pipefail
          echo "Qt: ${QT_MAC_ROOT:-<未设置>}"

          # ---- 自建最小 FFmpeg（通用架构 · 仅音频 · 纯 LGPL · securetransport TLS）----
          FFMPEG_UNIVERSAL=1 \
            bash third_party/neko-audio-engine/tools/build-ffmpeg-minimal.sh
          export NEKO_FFMPEG_ROOT="$PWD/third_party/ffmpeg-minimal/macos-universal"
          export NEKO_FFMPEG_BUNDLE=ON
          echo "FFmpeg(engine): $NEKO_FFMPEG_ROOT"
          echo "== 通用架构校验 =="
          lipo -info "$NEKO_FFMPEG_ROOT/lib/libavcodec."*.dylib || true

          chmod +x build_macos.sh
          ./build_macos.sh Release

          APP="build-macos/install/NekoMusic.app/Contents/MacOS/NekoMusic"
          echo "== 断言原生引擎已链接 =="
          otool -L "$APP" | grep -E "libavformat|libavcodec|libswresample" \
            || { echo "原生引擎未链接（libav* 缺失）"; exit 1; }
          echo "== bundle 内 FFmpeg dylib =="
          ls -1 "$(dirname "$APP")/../Frameworks"/libav*.dylib \
                "$(dirname "$APP")/../Frameworks"/libsw*.dylib 2>/dev/null || true

      - name: Resolve artifact path
        id: pack
        run: |
          set -euo pipefail
          PKG="$(find dist -maxdepth 1 -name 'Neko歌姬计划-*-macos-universal.pkg' -type f | head -n1 || true)"
          if [[ -z "$PKG" ]]; then
            echo "未在 dist/ 找到 .pkg"
            ls -la dist || true
            exit 1
          fi
          ls -lh "$PKG"
          echo "file=$PKG" >> "$GITHUB_OUTPUT"

          APP_BIN="build-macos/install/NekoMusic.app/Contents/MacOS/NekoMusic"
          if [[ -f "$APP_BIN" ]]; then
            ARCH_INFO="$(lipo -info "$APP_BIN")"
            echo "$ARCH_INFO"
            grep -q 'arm64' <<<"$ARCH_INFO" || { echo "通用二进制缺少 arm64"; exit 1; }
            grep -q 'x86_64' <<<"$ARCH_INFO" || { echo "通用二进制缺少 x86_64"; exit 1; }
          else
            echo "未找到 app 可执行文件，跳过架构检查"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-pkg
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}
