name: build-Releases

# 三平台一键出包：Linux(.deb) / Windows(NSIS .exe) / macOS(通用架构 .pkg)
# push 即触发；打 tag（v*）时额外上传到 GitHub Release 作为发布资产。

'on':
  push:
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因（可选）"
        required: false
        default: "manual"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.2'

jobs:
  # ============================================================
  # Linux：本机构建 + CPack 打包 .deb
  # ============================================================
  linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Qt 6 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Install packaging deps
        run: |
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            fakeroot \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswresample-dev

      - name: Build and package (.deb)
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: |
          set -euo pipefail
          echo "Qt: ${QT_ROOT_DIR:-<未设置>}"
          chmod +x build_linux.sh
          ./build_linux.sh Release

      # 断言原生无缝播放引擎确实被构建并链接（否则说明 FFmpeg 开发库缺失，
      # 悄悄回退到 QMediaPlayer —— 这里显式失败，避免 CI 假绿）。
      - name: Verify native engine is linked
        run: |
          set -euo pipefail
          BIN="build-linux/NekoMusic"
          test -x "$BIN" || { echo "未找到 $BIN"; exit 1; }
          echo "== ldd FFmpeg 依赖 =="
          ldd "$BIN" | grep -E "libavformat|libavcodec|libavutil|libswresample" \
            || { echo "原生引擎未链接（libav* 缺失）— FFmpeg 开发库可能未装"; exit 1; }

      - name: Resolve artifact path
        id: pack
        run: |
          set -euo pipefail
          DEB="$(find dist -maxdepth 1 -name 'Neko歌姬计划-*-linux-amd64.deb' -type f | head -n1 || true)"
          if [[ -z "$DEB" ]]; then
            echo "未在 dist/ 找到 .deb"
            ls -la dist || true
            exit 1
          fi
          ls -lh "$DEB"
          echo "file=$DEB" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}

  # ============================================================
  # Windows：原生构建（Qt 官方 MinGW 套件）→ windeployqt → NSIS 安装包
  # 构建 / 部署 / 打包放在同一个步骤里，避免跨步骤丢失部署目录
  # ============================================================
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Qt 6 (Windows MinGW kit)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'
          modules: 'qtmultimedia'
          tools: 'tools_mingw1310'
          cache: true
          install-deps: false

      - name: Build, deploy and package (.exe)
        shell: pwsh
        # 原生无缝播放引擎为可选：提供与 Qt 套件自带 FFmpeg DLL 同版本的 MinGW
        # 开发树并设置仓库变量 NEKO_FFMPEG_WIN_ROOT 指向它即可启用；未设置则跳过
        # （回退 QMediaPlayer），CI 保持绿。
        env:
          NEKO_FFMPEG_ROOT: ${{ vars.NEKO_FFMPEG_WIN_ROOT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root     = $PWD.Path
          $buildDir = Join-Path $root 'build-windows'
          $stage    = Join-Path $root 'build'          # NSIS 脚本约定的待打包目录

          # Qt 自带的 MinGW 工具链（g++ / gcc），确保优先于其它编译器
          $mingw = Get-ChildItem $env:IQTA_TOOLS -Directory |
                   Where-Object { Test-Path (Join-Path $_.FullName 'bin\g++.exe') } |
                   Select-Object -First 1
          if (-not $mingw) { throw "未在 $env:IQTA_TOOLS 找到 MinGW 工具链" }
          $env:Path = "$($mingw.FullName)\bin;$env:Path"

          if (-not $env:QT_ROOT_DIR) { throw "未取到 QT_ROOT_DIR，install-qt-action 可能没装上 Qt" }
          Write-Host "Qt    : $env:QT_ROOT_DIR"
          Write-Host "MinGW : $($mingw.FullName)"
          & g++ --version | Select-Object -First 1

          # ---- 诊断：Qt 套件自带 FFmpeg 布局（决定原生引擎如何链接）----
          Write-Host "== Qt FFmpeg 布局诊断 =="
          Write-Host "bin/av*.dll :"
          Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter 'av*.dll' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
          Write-Host "bin/sw*.dll :"
          Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter 'sw*.dll' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
          Write-Host "lib/ *av*.a (导入库):"
          Get-ChildItem "$env:QT_ROOT_DIR\lib" -Filter '*av*.a' -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | ForEach-Object { Write-Host "  $_" }
          Write-Host ("include/libavformat/avformat.h: {0}" -f (Test-Path "$env:QT_ROOT_DIR\include\libavformat\avformat.h"))

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }

          # ---- 获取与 Qt 自带 FFmpeg 同大版本的开发树（头 + MinGW 导入库）----
          # Qt 6.10.2 自带 FFmpeg 7.1（avcodec-61.dll，无 lib 前缀）；用 BtbN MinGW
          # 共享构建的 include/lib 链接，其导入库引用的 DLL 名与 Qt 自带一致 →
          # 运行期加载 Qt 的 DLL（同一套，不额外分发第二份 FFmpeg）。
          $avDll = Get-ChildItem "$env:QT_ROOT_DIR\bin" -Filter 'avcodec-*.dll' -ErrorAction SilentlyContinue |
                   Select-Object -First 1
          if ($avDll) {
            $major = [regex]::Match($avDll.Name, '-(\d+)\.dll$').Groups[1].Value
            # 与 Qt 自带 FFmpeg 大版本对应的 BtbN MinGW 开发树（含头 + 导入库；
            # 其 bin/avcodec-<major>.dll 与 Qt 同名 → 运行期复用 Qt 的 DLL）。
            $ffUrl = ''
            if     ($major -eq '61') { $ffUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-07-31-14-10/ffmpeg-n7.1.5-12-g1fdbca85aa-win64-gpl-shared-7.1.zip' }
            elseif ($major -eq '62') { $ffUrl = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip' }
            if ($ffUrl) {
              $ffRoot = Join-Path $env:RUNNER_TEMP "ffdev-$major"
              if (-not (Test-Path (Join-Path $ffRoot 'include\libavformat\avformat.h'))) {
                try {
                  $zip = Join-Path $env:RUNNER_TEMP "ffdev-$major.zip"
                  Write-Host "下载 FFmpeg dev: $ffUrl"
                  Invoke-WebRequest -Uri $ffUrl -OutFile $zip
                  Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
                  $inner = Get-ChildItem $env:RUNNER_TEMP -Directory |
                           Where-Object { $_.Name -like 'ffmpeg-*win64-gpl-shared*' } | Select-Object -First 1
                  if ($inner) {
                    Remove-Item $ffRoot -Recurse -Force -ErrorAction SilentlyContinue
                    Move-Item $inner.FullName $ffRoot
                  }
                } catch {
                  Write-Host "FFmpeg(engine): 开发树获取失败（$($_.Exception.Message)）→ 跳过原生引擎"
                }
              }
              if (Test-Path (Join-Path $ffRoot 'include\libavformat\avformat.h')) {
                $env:NEKO_FFMPEG_ROOT = $ffRoot
                Write-Host "FFmpeg(engine): 使用 $ffRoot"
              }
            } else {
              Write-Host "FFmpeg(engine): 未识别 Qt FFmpeg 大版本($major) → 跳过原生引擎"
            }
          }

          $ffArg = @()
          if ($env:NEKO_FFMPEG_ROOT) {
            Write-Host "FFmpeg(engine): $env:NEKO_FFMPEG_ROOT"
            $ffArg += "-DNEKO_FFMPEG_ROOT=$env:NEKO_FFMPEG_ROOT"
          } else {
            Write-Host "FFmpeg(engine): 未提供 → 跳过原生引擎（回退 QMediaPlayer）"
          }

          # ---------------- 构建 ----------------
          cmake -S $root -B $buildDir -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc `
            -DCMAKE_CXX_COMPILER=g++ `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            @ffArg
          if ($LASTEXITCODE -ne 0) { throw "CMake 配置失败" }

          cmake --build $buildDir --parallel
          if ($LASTEXITCODE -ne 0) { throw "编译失败" }

          $exe = Join-Path $buildDir 'NekoMusic.exe'
          if (-not (Test-Path $exe)) { throw "未生成 $exe" }

          # ---------------- 部署 Qt 依赖 ----------------
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          # 先部署依赖，再把主程序拷进去（避免 windeployqt 面对目标目录内的自身产物）
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release --compiler-runtime `
            --dir $stage $exe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt 失败，退出码 $LASTEXITCODE" }

          Copy-Item $exe (Join-Path $stage 'NekoMusic.exe')

          # 兼容 windeployqt 把插件放进 plugins\ 子目录的布局
          $pluginsSub = Join-Path $stage 'plugins'
          if (Test-Path $pluginsSub) {
            Copy-Item (Join-Path $pluginsSub '*') $stage -Recurse -Force
            Remove-Item $pluginsSub -Recurse -Force
          }

          # windeployqt 只跟随 exe 的导入表；链接了但未被引用的模块（如 SvgWidgets/Concurrent）
          # 它不会拷，但 NSIS 里是必选文件，这里从 Qt 的 bin 兜底补齐
          $qtDlls = @(
            'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Multimedia.dll',
            'Qt6Network.dll', 'Qt6Sql.dll', 'Qt6Svg.dll', 'Qt6SvgWidgets.dll',
            'Qt6Concurrent.dll'
          )
          foreach ($dll in $qtDlls) {
            $dst = Join-Path $stage $dll
            if (-not (Test-Path $dst)) {
              $srcDll = Join-Path $env:QT_ROOT_DIR "bin\$dll"
              if (Test-Path $srcDll) {
                Copy-Item $srcDll $dst
                Write-Host "  补拷 ${dll}（windeployqt 未部署）"
              }
            }
          }

          # MinGW 运行库兜底（同上）
          $mingwDlls = @('libstdc++-6.dll', 'libgcc_s_seh-1.dll', 'libwinpthread-1.dll')
          foreach ($dll in $mingwDlls) {
            $dst = Join-Path $stage $dll
            if (-not (Test-Path $dst)) {
              $srcDll = Join-Path $mingw.FullName "bin\$dll"
              if (Test-Path $srcDll) {
                Copy-Item $srcDll $dst
                Write-Host "  补拷 ${dll}（来自 MinGW 工具链）"
              }
            }
          }

          # 原生引擎链接的 FFmpeg：复用 Qt 自带的 av*/sw* DLL（与 Qt 插件同一套，
          # 不额外分发第二份），并断言 exe 导入表确实引用了 av*.dll。
          if ($env:NEKO_FFMPEG_ROOT) {
            Get-ChildItem "$env:QT_ROOT_DIR\bin\*.dll" |
              Where-Object { $_.Name -match '^(av|sw)[a-z0-9]+-\d+\.dll$' } |
              ForEach-Object {
                $dst = Join-Path $stage $_.Name
                if (-not (Test-Path $dst)) {
                  Copy-Item $_.FullName $dst
                  Write-Host "  补拷 $($_.Name)（Qt FFmpeg）"
                }
              }
            $objdump = Join-Path $mingw.FullName 'bin\objdump.exe'
            if (Test-Path $objdump) {
              $avImp = & $objdump -p $exe 2>$null | Select-String 'DLL Name: av'
              if (-not $avImp) { throw "原生引擎未链接 FFmpeg（NEKO_FFMPEG_ROOT 未生效？）" }
              Write-Host "  原生引擎已链接: $((($avImp | ForEach-Object { $_.ToString().Trim() }) -join '; '))"
            }
          }

          # NSIS 脚本里这些是必选文件，缺失时在这里就报清楚，别等 makensis 中止
          $required = @('NekoMusic.exe', 'platforms\qwindows.dll') + $qtDlls + $mingwDlls
          $missing = @($required | Where-Object { -not (Test-Path (Join-Path $stage $_)) })
          if ($missing.Count -gt 0) {
            Write-Host "---- $stage 内容 ----"
            Get-ChildItem $stage -Recurse -Depth 1 | Select-Object -First 60 FullName
            throw "部署目录缺少必需文件: $($missing -join ', ')"
          }

          # ---------------- NSIS 打包 ----------------
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis -y --no-progress
          }
          if (-not (Test-Path $makensis)) {
            $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          }
          if (-not $makensis -or -not (Test-Path $makensis)) { throw "未找到 makensis.exe" }

          $version = [regex]::Match((Get-Content (Join-Path $root 'CMakeLists.txt') -Raw),
            '(?m)^\s*VERSION\s+([0-9][0-9.]*)\s*$').Groups[1].Value
          if (-not $version) { throw "无法从 CMakeLists.txt 解析版本号" }
          Write-Host "版本: $version"

          Write-Host "部署目录: $stage"
          Get-ChildItem $stage -Filter '*.exe' | Select-Object Name, Length | Format-Table

          # 脚本内为 UTF-8（无 BOM），需显式指定输入字符集；
          # BUILD_DIR 传绝对路径，避免 makensis 对相对路径的解析基准不一致
          Push-Location (Join-Path $root 'packaging')
          try {
            & $makensis -V2 -INPUTCHARSET UTF8 "-DBUILD_DIR=$stage" `
              "-DVERSION=$version" nekomusic_installer.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis 失败，退出码 $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

          # NSIS 的 OutFile 约定落在仓库根目录；兜底再全仓搜一次
          $installer = Join-Path $root "Neko歌姬计划-$version-win.exe"
          if (-not (Test-Path $installer)) {
            $found = Get-ChildItem -Path $root -Recurse -Filter '*-win.exe' -File `
                     -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $installer = $found.FullName }
          }
          if (-not $installer -or -not (Test-Path $installer)) { throw "未生成 Windows 安装包" }

          $dist = Join-Path $root 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $target = Join-Path $dist "Neko歌姬计划-$version-win.exe"
          Copy-Item $installer $target -Force
          Get-Item $target | Format-List Name, Length

      - name: Resolve artifact path
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem -Path dist -Filter '*-win.exe' -File | Select-Object -First 1
          if (-not $exe) { throw "未在 dist/ 找到安装包" }
          "file=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}

  # ============================================================
  # macOS：通用架构（arm64 + x86_64）.pkg
  # ============================================================
  macos:
    name: macOS (.pkg, universal)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Qt 6 (macOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtmultimedia'
          cache: true

      - name: Build and package (universal .pkg)
        env:
          QT_MAC_ROOT: ${{ env.QT_ROOT_DIR }}
          # Qt 6.10 的 dylib 最低要求 macOS 13，按 11 链接只会刷一堆 ld 版本告警
          OSX_DEPLOYMENT_TARGET: '13.0'
          # 原生无缝播放引擎为可选：需提供**通用架构** FFmpeg 开发树并设置仓库变量
          # NEKO_FFMPEG_MAC_ROOT（单架构 Homebrew FFmpeg 会导致通用链接失败，见
          # third_party/archoera-audio-engine/CMakeLists.txt 的 macOS 守卫）；
          # 未设置则跳过（回退 QMediaPlayer）。
          NEKO_FFMPEG_ROOT: ${{ vars.NEKO_FFMPEG_MAC_ROOT }}
        run: |
          set -euo pipefail
          echo "Qt: ${QT_MAC_ROOT:-<未设置>}"
          [ -n "${NEKO_FFMPEG_ROOT:-}" ] && echo "FFmpeg(engine): $NEKO_FFMPEG_ROOT" \
            || echo "FFmpeg(engine): 未提供 → 跳过原生引擎（回退 QMediaPlayer）"

          # ---- 诊断：Qt 套件自带 FFmpeg 布局（决定原生引擎如何链接）----
          echo "== Qt 自带 FFmpeg 布局诊断 =="
          ls -l "$QT_MAC_ROOT"/lib/libav*.dylib "$QT_MAC_ROOT"/lib/libsw*.dylib 2>/dev/null \
            || echo "  (lib/ 下无 libav*.dylib)"
          for f in "$QT_MAC_ROOT"/lib/libavcodec.*.dylib; do
            if [ -f "$f" ]; then printf "  "; lipo -info "$f" || true; fi
          done
          if [ -f "$QT_MAC_ROOT/include/libavformat/avformat.h" ]; then
            echo "  include: 有 FFmpeg 头文件"
          else
            echo "  include: 无 FFmpeg 头文件"
          fi
          echo "  套件内 libavcodec*.dylib 位置:"
          find "$QT_MAC_ROOT" -maxdepth 3 -name 'libavcodec*.dylib' 2>/dev/null | head -5 | sed 's/^/    /'

          # ---- 复用 Qt 自带 universal FFmpeg 7.1：只补 7.1 头文件，库直接链 Qt 的 dylib ----
          FFM_VER=""
          for d in "$QT_MAC_ROOT"/lib/libavcodec.*.dylib; do
            if [ -f "$d" ]; then
              major="$(basename "$d" | cut -d. -f2)"
              case "$major" in 61) FFM_VER="7.1" ;; 62) FFM_VER="8.0" ;; 60) FFM_VER="6.1" ;; esac
              break
            fi
          done
          if [ -n "$FFM_VER" ]; then
            SRC="$RUNNER_TEMP/ffmpeg-$FFM_VER"
            if [ ! -f "$SRC/libavformat/avformat.h" ]; then
              echo "下载 FFmpeg $FFM_VER 源码头…"
              curl -fsSL "https://ffmpeg.org/releases/ffmpeg-$FFM_VER.tar.xz" \
                | tar -xf - -C "$RUNNER_TEMP" || true
            fi
            # 生成配置头（avconfig.h 等）；仅为取头，不编译
            if [ -f "$SRC/configure" ] && [ ! -f "$SRC/libavutil/avconfig.h" ]; then
              ( cd "$SRC" && ./configure --disable-everything --disable-programs \
                  --disable-doc --disable-autodetect --disable-x86asm --disable-network \
                  >/dev/null 2>&1 ) || true
            fi
            DEVDIR="$RUNNER_TEMP/ffdev"
            rm -rf "$DEVDIR"; mkdir -p "$DEVDIR/lib"
            ln -sfn "$SRC" "$DEVDIR/include"
            for l in avcodec avformat avutil swresample; do
              [ -f "$QT_MAC_ROOT/lib/lib$l.dylib" ] && \
                ln -sf "$QT_MAC_ROOT/lib/lib$l.dylib" "$DEVDIR/lib/lib$l.dylib"
            done
            if [ -f "$DEVDIR/include/libavformat/avformat.h" ] && [ -f "$DEVDIR/lib/libavformat.dylib" ]; then
              export NEKO_FFMPEG_ROOT="$DEVDIR"
              echo "FFmpeg(engine): ${DEVDIR}（头=FFmpeg $FFM_VER 源码；库=Qt 自带 universal dylib）"
            else
              echo "FFmpeg(engine): 头/库未就绪 → 跳过原生引擎"
            fi
          else
            echo "FFmpeg(engine): 未识别 Qt FFmpeg 大版本 → 跳过原生引擎"
          fi

          chmod +x build_macos.sh
          ./build_macos.sh Release
          if [ -n "${NEKO_FFMPEG_ROOT:-}" ]; then
            APP="build-macos/install/NekoMusic.app/Contents/MacOS/NekoMusic"
            echo "== 断言原生引擎已链接 =="
            otool -L "$APP" | grep -E "libavformat|libavcodec|libswresample" \
              || { echo "原生引擎未链接（libav* 缺失）"; exit 1; }
          fi

      - name: Resolve artifact path
        id: pack
        run: |
          set -euo pipefail
          PKG="$(find dist -maxdepth 1 -name 'Neko歌姬计划-*-macos-universal.pkg' -type f | head -n1 || true)"
          if [[ -z "$PKG" ]]; then
            echo "未在 dist/ 找到 .pkg"
            ls -la dist || true
            exit 1
          fi
          ls -lh "$PKG"
          echo "file=$PKG" >> "$GITHUB_OUTPUT"

          APP_BIN="build-macos/install/NekoMusic.app/Contents/MacOS/NekoMusic"
          if [[ -f "$APP_BIN" ]]; then
            ARCH_INFO="$(lipo -info "$APP_BIN")"
            echo "$ARCH_INFO"
            grep -q 'arm64' <<<"$ARCH_INFO" || { echo "通用二进制缺少 arm64"; exit 1; }
            grep -q 'x86_64' <<<"$ARCH_INFO" || { echo "通用二进制缺少 x86_64"; exit 1; }
          else
            echo "未找到 app 可执行文件，跳过架构检查"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-pkg
          path: ${{ steps.pack.outputs.file }}
          if-no-files-found: error

      - name: Upload release asset (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pack.outputs.file }}
