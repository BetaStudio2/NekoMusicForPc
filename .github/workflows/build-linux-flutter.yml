name: Build Flutter (Linux / macOS / Windows)

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "flutter/**"
      - "engine/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flutter/**"
      - "engine/**"
      - "scripts/**"
  release:
    types: [published]

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux（Debian/Ubuntu）：.deb ─────────────────────────────
  linux-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev qt6-base-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Build (release)
        run: ./scripts/build.sh release
      - name: Package .deb
        run: ./scripts/package-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nekomusic-linux-deb
          path: flutter/build/dist/*.deb
          if-no-files-found: error

  # ── Linux（Fedora/RPM 系）：.rpm ─────────────────────────────
  linux-rpm:
    runs-on: ubuntu-24.04
    container: fedora:latest
    timeout-minutes: 45
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git curl jq which xz tar file cmake ninja-build gcc-c++ clang gtk3-devel \
            mpv-libs-devel qt6-qtbase-devel rpm-build
      - uses: actions/checkout@v4
      - name: Git safe directory (容器属主)
        run: git config --global --add safe.directory '*'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Build (release)
        run: ./scripts/build.sh release
      - name: Package .rpm
        run: ./scripts/package-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nekomusic-linux-rpm
          path: flutter/build/dist/*.rpm
          if-no-files-found: error

  # ── macOS：.app（zip）────────────────────────────────────────
  macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: brew install cmake ninja mpv qt
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Build (release)
        run: ./scripts/build.sh release
      - name: Package .app (zip)
        run: |
          APP_DIR=$(ls -d flutter/build/macos/Build/Products/Release/*.app | head -1)
          APP_NAME=$(basename "$APP_DIR")
          (cd "$(dirname "$APP_DIR")" && zip -qry "$GITHUB_WORKSPACE/$APP_NAME.zip" "$APP_NAME")
      - uses: actions/upload-artifact@v4
        with:
          name: nekomusic-macos
          path: "*.zip"
          if-no-files-found: error

  # ── Windows：手动触发（实验性）──────────────────────────────
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true
      - name: Setup Ninja
        run: choco install ninja -y
      - name: Setup libmpv
        shell: pwsh
        run: |
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260902/mpv-dev-x86_64-20260902-git-174b638f29.7z'
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -o"$env:RUNNER_TEMP\mpv"
          # 归档自带一层目录且内含 mingw 导入库；MSVC 可消费 COFF .lib——
          # 改名为 mpv.lib 供 find_library。搜索基准用 RUNNER_TEMP 兼容嵌套结构
          $root = Get-ChildItem "$env:RUNNER_TEMP\mpv" -Recurse -Filter client.h |
            Where-Object FullName -Match '\\mpv\\client\\.h$' | Select-Object -First 1
          if (-not $root) { throw 'mpv headers not found in archive' }
          $inc = Split-Path (Split-Path $root.FullName -Parent) -Parent
          $import = Get-ChildItem "$env:RUNNER_TEMP\mpv" -Recurse -Filter *.a |
            Where-Object Name -match 'libmpv|mpv' | Select-Object -First 1
          if (-not $import) { throw 'mpv import lib (.a) not found' }
          New-Item -ItemType Directory -Force -Path "$inc\lib" | Out-Null
          Copy-Item $import.FullName "$inc\lib\mpv.lib"
          echo "MPV_DIR=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Enable MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build (release)
        shell: cmd
        run: scripts\build.bat release
      - uses: actions/upload-artifact@v4
        with:
          name: nekomusic-windows-x64
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error

  # ── Release：附加全部产物 ────────────────────────────────────
  attach-release:
    if: github.event_name == 'release'
    needs: [linux-deb, linux-rpm, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
