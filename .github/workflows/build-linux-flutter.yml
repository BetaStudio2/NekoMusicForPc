name: Build Flutter Linux

'on':
  workflow_dispatch:
    inputs:
      reason:
        description: "手动触发原因（可选）"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "flutter/**"
      - "engine/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/build-linux-flutter.yml"
  pull_request:
    paths:
      - "flutter/**"
      - "engine/**"
      - "scripts/**"
  release:
    types: [published]

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 引擎依赖: libmpv；Qt 核心桥依赖: Qt6 Core/Network/Sql/Gui（qt6-base-dev）
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libgtk-3-dev \
            libmpv-dev \
            qt6-base-dev

      - name: Setup Flutter (stable 3.44+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Build (release)
        run: ./scripts/build.sh release

      - name: Package tarball
        run: ./scripts/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekomusic-linux-x64
          path: flutter/build/dist/*.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: flutter/build/dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Qt6（核心桥）与 Ninja
      - name: Setup Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Setup Ninja
        run: choco install ninja -y

      # libmpv 开发包（头文件 + 导入库 + DLL），固定版本避免上游变动
      - name: Setup libmpv
        shell: pwsh
        run: |
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20240609/mpv-dev-x86_64-20240609-git-a069d26.7z'
          Invoke-WebRequest -Uri $url -OutFile mpv-dev.7z
          7z x mpv-dev.7z -o"$env:RUNNER_TEMP\mpv"
          echo "MPV_DIR=$env:RUNNER_TEMP\mpv" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup Flutter (stable 3.47+)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Build (release)
        shell: cmd
        run: scripts\build.bat release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nekomusic-windows-x64
          path: flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
